name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with full output
      run: ./gradlew assembleDebug --stacktrace --info --scan
      continue-on-error: true

    - name: Find and Print Build Errors
      run: |
        find app/build -name "*.log" -o -name "build.txt" | while read file; do
          echo "=== $file ==="
          cat "$file"
        done
        find . -name "hs_err_pid*.log" | while read file; do
          cat "$file"
        done
